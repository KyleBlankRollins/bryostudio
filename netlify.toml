[build]
  publish = "site"
  # Type-checks the functions and scripts (TypeScript 7); a type error fails
  # the deploy. The site itself has no build step.
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# Serverless functions, written in TypeScript and bundled by Netlify (each
# answers at the path in its own config).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# HTML: always check for a fresh copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Stylesheet and SVGs: cache for a day, then revalidate. Filenames are not
# hashed, so keep this short enough that edits show up.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=604800"
