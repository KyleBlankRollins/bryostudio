[build]
  publish = "dist"
  # Type-checks the functions and scripts (TypeScript 7), then builds the
  # site with Astro into dist/; either failing fails the deploy.
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# Serverless functions, written in TypeScript and bundled by Netlify (each
# answers at the path in its own config).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # script-src 'self' is for the site's own two scripts: theme.js (the
    # light/dark toggle) and the home page's riverbank.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# HTML: always check for a fresh copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Astro's bundled assets (the stylesheet): their names carry a hash of their
# content, so a changed file gets a new name and can be cached for good.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The theme script and SVGs keep their names: cache for a day or a week, then
# revalidate, short enough that edits show up.
[[headers]]
  for = "/theme.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=604800"
